# Streamlit theme for the Content Death Clock dashboard.

[theme]
base = "light"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'Bricolage Grotesque':https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "12px"
baseFontSize = 16
showWidgetBorder = true
primaryColor = "#7138c8"
backgroundColor = "#f5f0e6"
secondaryBackgroundColor = "#fffdf8"
textColor = "#25232b"
borderColor = "#e5ded2"
linkColor = "#5925ad"

[client]
# Visitors see the page, not Streamlit's developer menu or error tracebacks.
toolbarMode = "minimal"
showErrorDetails = "none"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
