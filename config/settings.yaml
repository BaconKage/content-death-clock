# Content Death Clock — central configuration.
# Everything that defines the experiment lives here, not scattered in code,
# so the pre-registered analysis plan can reference exact values.

project:
  name: content-death-clock
  timezone: UTC          # all timestamps stored in UTC, always

collection:
  # A post enters the panel when discovered, and is snapshotted until it exceeds
  # max_track_hours. Discovery runs every cycle so a post is picked up within ~1h
  # of publishing.
  max_track_hours: 336          # 14 days
  discovery_lookback_hours: 6   # only admit posts published this recently
  # Target snapshot ages (hours since publish). The scheduler is hourly, so the
  # runner snapshots a post when its age crosses one of these marks.
  snapshot_schedule_hours: [1, 3, 6, 12, 24, 36, 48, 72, 96, 120, 168, 240, 336]
  # Tolerance for "this snapshot satisfies that scheduled mark".
  snapshot_tolerance_hours: 0.75

youtube:
  enabled: true
  api_base: https://www.googleapis.com/youtube/v3
  # videos.list accepts up to 50 ids per call in practice (docs say 50 for most
  # resources); we batch at 50 to stay safely inside the contract.
  ids_per_stats_call: 50
  playlist_page_size: 50
  daily_quota_units: 10000
  # Guard rail: abort a cycle if it would exceed this share of the daily budget.
  max_quota_per_cycle: 400

instagram:
  enabled: true
  # NOTE: base has no version segment; endpoints carry their own (/v1/..., /v2/...)
  api_base: https://api.scrapecreators.com

  # --- credit budget ---
  # The API returns NO balance header, so spending is invisible unless we count
  # it ourselves. This is a hard local cap, tracked in
  # data/bronze/_credits/scrapecreators.json. Set it to what the account
  # actually has; raising it does not buy credits.
  credit_budget_total: 100  # per key; the ledger is per-key so a new key starts fresh
  max_calls_per_cycle: 25

  # --- cadence: ONE INTENSIVE COHORT, not a continuous panel ---
  # 99 credits cannot fund three weeks of Instagram collection at any useful
  # sample size, so Instagram is scoped as a feasibility demonstration: proof
  # the pipeline generalises across platforms, plus one real cross-platform
  # figure. It is NOT a second dataset for hypothesis testing, and the paper
  # must say so. n will be too small for inference.
  #
  # Budget: 16 rounds x 5 accounts = 80 credits of the 90 remaining, leaving 10
  # as retry margin. The window is
  # END-EXCLUSIVE, so rounds land at 0, 3, ... 45h. Counting it as inclusive
  # gives 17 rounds and overspends - a test pins this.
  # Credits buy curve QUALITY here, not account count: a post published during
  # the window is caught within 3h and then tracked every 3h, which is dense
  # enough to fit a decay curve. Spreading the same credits over more accounts
  # would sample too raggedly to fit anything.
  mode: cohort
  cohort_start_utc: "2026-08-30T17:00:00+00:00"   # STARTED. Set back to null to abort.
  # Cohort A. Rounds every 3h at 0..45h, 16 rounds x 5 accounts = 80 credits
  # of the 90 available. To abort: set cohort_start_utc back to null.
  cohort_interval_hours: 3
  cohort_duration_hours: 48
  max_accounts: 5
  max_posts: 200              # hard cap on panel size

storage:
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold

labels:
  # --- The operational definition of "attention death". ---
  # Primary: velocity falls below `velocity_frac_of_peak` of the post's own peak
  # velocity and STAYS below for `sustain_intervals` consecutive intervals.
  velocity_frac_of_peak: 0.05
  sustain_intervals: 2
  # A post needs at least this many intervals before we will label it at all.
  # Below this the peak velocity is too poorly estimated to normalise against.
  min_intervals_for_label: 4
  # Whether to exclude the first (0->1h) interval when locating peak velocity.
  # Default false: for most posts the first hour genuinely IS the peak, and
  # excluding it would discard real signal. Flip to true only if EDA shows a
  # platform-side counter artefact, and report the change in the paper.
  peak_skip_first_interval: false
  # Robustness label: time to reach this fraction of fitted asymptote A.
  saturation_target: 0.90
  # --- primary engagement metric, PER PLATFORM ---
  # This is a methodological choice, not a config detail. Instagram reports no
  # view count for image posts (video_view_count is null when is_video=false),
  # so views cannot be the metric there. Likes saturate faster than views, which
  # means death times are NOT directly comparable across the two platforms. The
  # paper must report per-platform results separately and say why.
  primary_metric:
    youtube: views
    instagram: likes
  # Posts whose counts the creator has hidden are excluded: the API reports 0,
  # which is indistinguishable from genuine non-engagement and would read as
  # instant death.
  exclude_hidden_counts: true

modelling:
  feature_cutoff_hours: 6      # LEAKAGE GUARD: no feature may use data after this
  cohort_a_freeze_utc: null    # set on Day 18, e.g. "2026-09-16T00:00:00Z"
  cv:
    strategy: group_kfold      # grouped by creator — never random k-fold
    n_splits: 5
  bootstrap_iterations: 2000
  random_seed: 20260830
