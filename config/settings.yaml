# Content Death Clock — central configuration.
# Everything that defines the experiment lives here, not scattered in code,
# so the pre-registered analysis plan can reference exact values.

project:
  name: content-death-clock
  timezone: UTC          # all timestamps stored in UTC, always

collection:
  # A post enters the panel when discovered, and is snapshotted until it exceeds
  # max_track_hours. Discovery runs every cycle so a post is picked up within ~1h
  # of publishing.
  max_track_hours: 336          # 14 days
  # Admit posts up to this old. Kept generous deliberately: when the scheduler
  # skips slots, a post can be hours old before we first see it, and admitting
  # it late with an honest age beats not admitting it at all. Its early marks
  # are simply recorded as missing rather than guessed.
  discovery_lookback_hours: 6
  # Target snapshot ages (hours since publish). The scheduler is hourly, so the
  # runner snapshots a post when its age crosses one of these marks.
  snapshot_schedule_hours: [1, 3, 6, 12, 24, 36, 48, 72, 96, 120, 168, 240, 336]
  # Tolerance for "this snapshot satisfies that scheduled mark".
  snapshot_tolerance_hours: 0.75

  # --- per-creator admission cap (plan amendment, 2026-08-31) ---
  # At most this many posts from one creator per UTC day. Added after a single
  # channel published 100 videos within 25 seconds and supplied 59% of the
  # YouTube panel with near-zero-engagement content (median 4 views, against
  # 1,152 for every other post). Those 100 are not 100 independent observations:
  # one channel, one moment, one action. Without a cap, any bulk uploader can
  # dominate the sample and the creator-size stratification becomes meaningless.
  # Enforced at admission AND at analysis, so posts already collected are
  # excluded consistently and counted in the attrition table.
  # Applied PER PLATFORM. YouTube carries every hypothesis, so its independence
  # assumption must be protected. Instagram is a bounded demonstration on which
  # no hypothesis is tested (see ANALYSIS_PLAN section 4), its accounts were
  # deliberately selected for posting often, and its data cost real credits -
  # so capping it would discard paid-for data to solve a problem it does not
  # have. 0 means no cap.
  max_posts_per_creator_per_day:
    youtube: 5
    instagram: 0

youtube:
  enabled: true
  api_base: https://www.googleapis.com/youtube/v3
  # videos.list accepts up to 50 ids per call in practice (docs say 50 for most
  # resources); we batch at 50 to stay safely inside the contract.
  ids_per_stats_call: 50
  playlist_page_size: 50
  daily_quota_units: 10000
  # Guard rail: abort a cycle if it would exceed this share of the daily budget.
  max_quota_per_cycle: 400

instagram:
  enabled: true
  # NOTE: base has no version segment; endpoints carry their own (/v1/..., /v2/...)
  api_base: https://api.scrapecreators.com

  # --- credit budget ---
  # The API returns NO balance header, so spending is invisible unless we count
  # it ourselves. This is a hard local cap, tracked in
  # data/bronze/_credits/scrapecreators.json. Set it to what the account
  # actually has; raising it does not buy credits.
  credit_budget_total: 100  # per key; the ledger is per-key so a new key starts fresh
  max_calls_per_cycle: 25

  # --- cadence: BOUNDED COHORTS, not a continuous panel ---
  # Credits cannot fund three weeks of Instagram at any useful sample size, so
  # Instagram is a feasibility demonstration: proof the pipeline generalises
  # across platforms, plus one cross-platform figure. It is NOT a second
  # dataset for hypothesis testing, and the paper says so.
  #
  # --- COHORT B (started 2026-09-01) ---
  # 24 rounds x 3 accounts = 72 credits.
  #
  # Cohort A ran 16 rounds x 5 accounts over 48h and failed: 326 posts at a
  # median of ONE snapshot each, 43 analysable, one observed death. The lesson
  # is that credits buy curve QUALITY, not panel width. Three accounts over 72h
  # is the same money spent on depth:
  #
  #             Cohort A (actual)      Cohort B (projected)
  #   accounts            5                     3
  #   window            48h                   72h
  #   posts             326                  ~27
  #   snaps/post        2.5                   8-12
  #
  # Fewer posts is the POINT. A post needs 4 usable intervals to be labelled at
  # all, so 27 posts with 10 snapshots each beats 326 with one.
  mode: cohort
  cohort_start_utc: "2026-09-02T11:00:00+00:00"   # Cohort B. null to abort.
  cohort_interval_hours: 3
  cohort_duration_hours: 72
  max_accounts: 3
  max_posts: 200              # hard cap on panel size

storage:
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold

labels:
  # --- The operational definition of "attention death". ---
  # Primary: velocity falls below `velocity_frac_of_peak` of the post's own peak
  # velocity and STAYS below for `sustain_intervals` consecutive intervals.
  velocity_frac_of_peak: 0.05
  sustain_intervals: 2
  # A post needs at least this many intervals before we will label it at all.
  # Below this the peak velocity is too poorly estimated to normalise against.
  min_intervals_for_label: 4
  # Whether to exclude the first (0->1h) interval when locating peak velocity.
  # Default false: for most posts the first hour genuinely IS the peak, and
  # excluding it would discard real signal. Flip to true only if EDA shows a
  # platform-side counter artefact, and report the change in the paper.
  peak_skip_first_interval: false
  # Robustness label: time to reach this fraction of fitted asymptote A.
  saturation_target: 0.90
  # --- primary engagement metric, PER PLATFORM ---
  # This is a methodological choice, not a config detail. Instagram reports no
  # view count for image posts (video_view_count is null when is_video=false),
  # so views cannot be the metric there. Likes saturate faster than views, which
  # means death times are NOT directly comparable across the two platforms. The
  # paper must report per-platform results separately and say why.
  primary_metric:
    youtube: views
    instagram: likes
  # Posts whose counts the creator has hidden are excluded: the API reports 0,
  # which is indistinguishable from genuine non-engagement and would read as
  # instant death.
  exclude_hidden_counts: true

modelling:
  # --- landmark design (plan amendment 2026-09-01) ---
  # Predictions are made AT the landmark, using only observations up to it, and
  # the outcome is the time REMAINING from the landmark until attention death.
  #
  # Why: with the outcome measured from publication, 53% of observed deaths fell
  # INSIDE the 6-hour feature window. A post dying at 3.1h has its death
  # determined by the same observations its features are built from, so
  # "predicting" it is circular. Landmarking is the standard survival remedy:
  # a subject must be at risk at the moment of prediction.
  #
  # 7.0 rather than 6.0 because the scheduler runs every 30 minutes, so the
  # nominal 6-hour measurement actually lands at a median of 6.08h. A strict
  # 6.00 cutoff discarded it for 72 of 86 posts, which is why every 6-hour
  # feature was 0% available. The snapshot schedule has nothing between 6h and
  # 12h, so any observation at or before 7h IS one of the scheduled 1/3/6-hour
  # measurements, arriving late.
  feature_cutoff_hours: 7.0
  landmark_hours: 7.0
  # Pre-specified 2026-08-30, before any outcome data was examined.
  cohort_a_freeze_utc: "2026-09-16T00:00:00Z"
  cv:
    strategy: group_kfold      # grouped by creator — never random k-fold
    n_splits: 5
  bootstrap_iterations: 2000
  random_seed: 20260830
