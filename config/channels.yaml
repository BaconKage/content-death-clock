# --------------------------------------------------------------------------
# SAMPLE FRAME. This file defines who we observe, and therefore what the RM
# paper can claim to generalise over. Treat it as a research instrument.
#
# `tier` and `subscriber_count` below are PROVISIONAL. Run:
#     python -m cdc.collect.resolve_channels
# which verifies every handle against the API, fills in channel_id, uploads
# playlist id and live subscriber_count, and REWRITES the tier from real data.
# Never hand-edit a resolved value.
#
# Target: 60-100 channels, spread across all three tiers and >= 4 categories.
# Current starter frame is deliberately incomplete — the micro tier especially
# needs the team to add channels they actually follow.
#
# tier boundaries (assigned by the resolver):
#   micro  <   10,000 subscribers
#   mid       10,000 - 500,000
#   large  >  500,000
# --------------------------------------------------------------------------

