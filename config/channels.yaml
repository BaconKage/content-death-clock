instagram:
  # Scrape Creators cohort. Public accounts only.
  #
  # SELECTION CRITERION, measured not guessed: the grid must turn over slowly
  # enough for a post to be watched, and fast enough for fresh posts to appear
  # inside the window. The profile endpoint returns only the ~12 most recent
  # posts, so a post is visible only until 12 newer ones displace it.
  #
  # Screen a candidate with:  python -m cdc.collect.ig_screen --handles X Y Z
  # One credit each; it measures the rate directly from the returned grid.
  #
  # --- COHORT A (2026-08-30 to 2026-09-01), RETAINED FOR THE RECORD ---
  # It failed. 326 posts, median 1 snapshot each, 43 analysable, ONE death.
  # Two of the five accounts produced 222 posts and almost no usable curves.
  #
  # It failed despite being screened, because the screening was wrong. The
  # rate was measured from the span of the returned grid WITHOUT excluding
  # pinned posts, and a pinned post sits at the top of the grid indefinitely:
  #
  #   sarcastic_us   screened 0.5/day  ->  actually ~37.6/day
  #   (one pinned post from 8 days earlier stretched the measured span from
  #    5.1h to 197h, turning a firehose into an apparently ideal account)
  #
  # accounts_cohort_a:
  #   fcbarcelona, 9gag, instantbollywood, nba, sarcastic_us
  #
  # --- COHORT B: screened 2026-09-01 with pinned posts excluded ---
  # Sized for a 72h window at 3h intervals = 24 rounds x 3 accounts = 72
  # credits. Chosen over five accounts at 48h because credits buy curve
  # QUALITY here, not account count: Cohort A proved that a wide, shallow
  # panel yields nothing labelable.
  #
  #   account          posts/day   grid retention   predicted snaps/post
  #   spotify               1.5            186h             12
  #   bonappetitmag         1.3            218h             12
  #   9gag                  6.1             47h              8
  #
  # PROVENANCE. The posts/day and grid-retention figures above are checkable
  # against `config/ig_screening.json`, and `tests/test_ig_screen.py` asserts
  # they still match. Two caveats a reader should have:
  #
  #   * That artifact was measured for a 48h window (`duration_hours: 48.0`),
  #     so its `predicted_snapshots` column reads 8.0 / 8.0 / 7.8 where the
  #     table above says 12 / 12 / 8. The table is the same measurement carried
  #     forward to the 72h cohort that was actually run; the underlying rates
  #     are identical.
  #   * bonappetitmag carries `verdict: REJECT` in the artifact, on the ground
  #     that 1.3 posts/day yields only ~3 new posts inside 48 hours. Extending
  #     the window to 72h is precisely what made it viable, and it was selected
  #     on that basis. The rejection is left in the artifact rather than
  #     rewritten, because the disagreement is the evidence.
  #
  # This file was briefly lost: `ig_screen.run()` wrote to it unconditionally
  # and the test suite calls that function with fake handles, so running the
  # tests replaced these measurements with three placeholder HTTP 500s — and
  # that state was committed on 2026-09-02. It was recovered from commit
  # a8b044a. The tool now takes an `out_path` and the tests pass their own.
  #
  # Rejected at the same screening, with reasons:
  #   wired          likes hidden -> API reports 0 -> reads as instant death
  #   natgeo         0.3/day  -> ~0 new posts inside the window
  #   nasa           0.6/day  -> ~1 new post
  #   tasty          0.0/day  -> dormant
  #   fcbarcelona   12.4/day  -> now too fast; was 9.4/day during Cohort A
  #   theverge       too few posts to measure
  #   vogue          handle not found
  accounts:
    - {handle: "spotify",       category: music,         tier: large}
    - {handle: "bonappetitmag", category: food,          tier: large}
    - {handle: "9gag",          category: memes,         tier: large}

  # Cohort A's accounts, kept so the earlier data remains interpretable.
  accounts_cohort_a:
    - {handle: "fcbarcelona",      category: sport,         tier: large}
    - {handle: "9gag",             category: memes,         tier: large}
    - {handle: "instantbollywood", category: entertainment, tier: large}
    - {handle: "nba",              category: sport,         tier: large}
    - {handle: "sarcastic_us",     category: memes,         tier: large}
