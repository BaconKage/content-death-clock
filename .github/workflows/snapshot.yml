name: collect

# The heartbeat of the whole project.
#
# PRIMARY TRIGGER is external: cron-job.org calls the workflow_dispatch API every
# 30 minutes. GitHub's own scheduler is kept only as a fallback — see the cron
# block below for the measurements that forced that decision.
#
# Why CI and not a laptop: this must run unattended for three weeks. A student
# machine sleeps, loses wifi, and reboots for updates, and a gap in the first
# six hours of a post's life destroys exactly the early-velocity features the
# study depends on. Those hours cannot be re-scraped — the past is gone.
#
# Timing is never assumed. We record the ACTUAL observation timestamp and compute
# velocity from real elapsed time, so a late snapshot is late-but-honest rather
# than silently mislabelled as on-time. That property is what made the scheduler
# shortfall measurable rather than invisible.
#
# Known GitHub scheduler behaviour:
#   * Runs are delayed AND skipped under load — measured here at ~1 slot in 3,
#     not the "few minutes" the docs imply.
#   * Scheduled workflows only run on the default branch, and are disabled after
#     60 days of repository inactivity. We commit data continuously, so the repo
#     is never inactive.
#
# Several runs inside the same clock hour share a cycle_id and therefore a
# bronze filename. That is safe: the writer merges with what is already on disk
# and deduplicates, so nothing is lost and nothing is duplicated.

on:
  schedule:
    # FALLBACK ONLY. The primary trigger is an external scheduler (cron-job.org)
    # calling workflow_dispatch every 30 minutes, because GitHub's own scheduler
    # proved unusable here: measured 2026-08-31, an hourly cron produced runs
    # 3.03h apart, roughly one slot in three, and a 7-hour gap overnight.
    #
    # This is kept at hourly, not */15, for budget reasons. Both schedulers at
    # their earlier rates projected to 2,000 Actions minutes over the collection
    # window - the entire free allowance for a private repo, with no margin, and
    # collection stopping dead if GitHub ever started honouring every slot.
    # Hourly costs ~222 minutes and keeps some data flowing if the external
    # scheduler fails, which the health monitor would then surface.
    - cron: "7 * * * *"
  workflow_dispatch:            # manual trigger, for the Day 3 smoke test
    inputs:
      dry_run:
        description: "Plan the cycle without spending quota"
        type: boolean
        default: false

# Never let two cycles run at once: they would race on the same bronze file
# and on the git push. Queue instead of cancelling — a queued cycle is late,
# a cancelled one is lost.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write               # required to commit the collected data

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection cycle
        id: collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          PYTHONPATH: src
        run: |
          python -m cdc.collect.runner ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee cycle-report.json

      # Instagram runs as a bounded cohort on its own 3-hourly clock, so the
      # overwhelming majority of invocations of this step deliberately do
      # nothing and spend nothing. It must never fail the job: a Scrape Creators outage is not a
      # reason to lose the YouTube snapshot, which is the primary dataset.
      - name: Run Instagram cohort round
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SCRAPECREATORS_API_KEY_2: ${{ secrets.SCRAPECREATORS_API_KEY_2 }}
          SCRAPECREATORS_API_KEY_3: ${{ secrets.SCRAPECREATORS_API_KEY_3 }}
          PYTHONPATH: src
        run: python -m cdc.collect.ig_runner | tee ig-report.json

      - name: Commit collected data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "cdc-collector[bot]"
          git config user.email "cdc-collector@users.noreply.github.com"
          git add data/bronze
          if git diff --cached --quiet; then
            echo "nothing new this cycle"
            exit 0
          fi
          git commit -m "data: collection cycle $(date -u +%Y-%m-%dT%H:%M)"
          # Another cycle may have pushed while we ran. Rebase rather than
          # force — every cycle's data is wanted, none may be discarded.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1

      - name: Upload cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-report-${{ github.run_id }}
          path: cycle-report.json
          retention-days: 14

      # A red X in the Actions tab is the alarm. Check it daily — a silent
      # three-day outage is the single most expensive failure this project has.
      - name: Fail loudly on collection errors
        if: ${{ !inputs.dry_run }}
        env:
          PYTHONPATH: src
        run: python -m cdc.collect.monitor --fail-on-gap
